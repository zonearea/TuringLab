name: "unary_div3"
description: "Unary 1^n, n 3'un kati ise kabul (ornek: 111 -> kabul, 11 -> ret)."
states: [q_start, q0, q1, q2, q_accept, q_reject]
input_alphabet: ["1"]
tape_alphabet: ["1", "B"]
blank: "B"
start_state: q_start
accept_states: [q_accept]
reject_states: [q_reject]
transitions:
  - {state: q_start, read: "B", next: q_reject, write: "B", move: R}
  - {state: q_start, read: "1", next: q1, write: "1", move: R}
  - {state: q0, read: "B", next: q_accept, write: "B", move: R}
  - {state: q0, read: "1", next: q1, write: "1", move: R}
  - {state: q1, read: "B", next: q_reject, write: "B", move: R}
  - {state: q1, read: "1", next: q2, write: "1", move: R}
  - {state: q2, read: "B", next: q_reject, write: "B", move: R}
  - {state: q2, read: "1", next: q0, write: "1", move: R}
